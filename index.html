@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<main class="stage" id="stage">
  <div class="wcol" id="wcol"><div class="wprim" id="wprim">
  <div class="wrap" id="wrap">
    <div class="layers" id="layers"></div>
    <div class="player" id="player">
      <video id="v" playsinline loop></video>
      <div class="empty">YouTubeのURLを貼るか、動画ファイルをドロップ</div>
    </div>
    <div class="pl" id="pl">
      <div class="shade"></div>
      <div class="ripple" id="rp"></div>
      <div class="ui">
        <button class="ctl ico gear" id="pGear" aria-label="設定"></button>
        <div class="center"><button class="ctl ico big" id="mBack" aria-label="10秒戻る"></button><button class="ctl ico huge" id="mPlay" aria-label="再生/一時停止"></button><button class="ctl ico big" id="mFwd" aria-label="10秒進む"></button></div>
        <div class="bar ctl" id="bar"><div class="trk"><div class="fill" id="fill"></div></div><div class="dot" id="dot"></div></div>

  </div>
  <div id="winfo"></div></div>
  <aside class="wside" id="wside"></aside></div>

  <section class="panel">
    <div class="row">
      <input class="url" id="url" type="text" inputmode="url" placeholder="YouTubeのURLを貼り付け" enterkeyhint="go" autocomplete="off">
      <button id="bLoad">読み込む</button>
    </div>
    <div class="row">
      <label class="btn" id="bFile" tabindex="0">動画ファイル<input id="file" type="file" accept="video/*" hidden></label>
      <button id="bCap">タブ / 画面を取り込む</button>
      <button id="bMob">プレーヤー</button>

      <label class="s"><b>光の広がり<output id="oSp"></output></b><input id="rSp" type="range" min=".4" max="2.2" step=".01" value=".9"></label>

<div class="about" id="about" role="dialog" aria-modal="true" aria-label="このアプリについて"><div class="box">
  <h2>このアプリについて</h2>
  <ul>
    <li>動画ファイルや取り込んだ画面の映像は、この端末のブラウザの中だけで処理されます。アップロードされません。</li>
    <li>YouTubeはYouTube公式の埋め込みプレーヤーで再生します。タイトルの取得に外部サービス(noembed.com)を使うので、動画IDがそこに送られます。YouTubeとは無関係の非公式アプリです。</li>
    <li id="aboutSample">プレーヤーモードの関連動画やコメントは、見た目を再現するためのサンプルです。実際のものではありません。</li>
    <li>設定はこの端末のブラウザにだけ保存されます。</li>
  </ul>
  <button id="bAboutX">閉じる</button>

<script>
(()=>{
const $=s=>document.querySelector(s);
const v=$('#v'), player=$('#player'), layersEl=$('#layers'), msg=$('#msg');
const ENABLE_PLAYER_UI=false; /* trueにするとYouTube風プレーヤーモード(操作UI・画面全体・コメント)が復活します */
const ENABLE_YT=true; /* falseにするとYouTube機能を外して公開できます */
let ytOpts={controls:1,start:0,autoplay:0};
const ytExtra=()=>(ytOpts.controls===0?'&controls=0&disablekb=1':'')+(ytOpts.start?'&start='+Math.floor(ytOpts.start):'')+(ytOpts.autoplay?'&autoplay=1':'');
let P={sp:.9,bl:18,inn:1,sa:1,fe:0,bst:1,n:16}, mode='', curId='', frames=[], canvases=[], objUrl=null, capStream=null, ytTimer=0, ytCheck=0;

/* ---------- params ---------- */
function apply(){
  document.documentElement.style.setProperty('--fe',P.fe+'px');
  const n=layersEl.children.length, bf=Math.max(1,(1+.506*P.sp)/1.5);
  [...layersEl.children].forEach((el,i)=>{
    const t=n>1?1-i/(n-1):0;
    el.style.transform=`scale(${1+(.006+t*.5)*P.sp})`;
    el.style.filter=`blur(${((.28+.72*Math.pow(t,.85))*P.bl*bf).toFixed(1)}px) saturate(${1+(P.sa-1)*t}) brightness(${(1+(P.bst-1)*(.3+.7*t)).toFixed(3)})`;
    el.style.opacity=Math.min(1,P.inn*(1-.2*t));
  });
  document.documentElement.style.setProperty('--fe',P.fe+'px');
}
/* 設定の保存・復元 / 端末に合わせた初期値 */
const SL=['rSp','rBl','rIn','rSa','rFe','rBs','rN'], SKEY='alr.settings.v1';
let savedSp=null;
try{
  const sv=JSON.parse(localStorage.getItem(SKEY)||'null');
  if(sv){SL.forEach(id=>{if(sv[id]!=null)$('#'+id).value=sv[id]});if(sv.rSp!=null)savedSp=+sv.rSp;if(sv.rN!=null)P.n=+sv.rN}
  else if((navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)){$('#rN').value=8;P.n=8}

[['rSp','oSp','sp',x=>x.toFixed(2)+'x'],['rBl','oBl','bl',x=>x+'px'],['rIn','oIn','inn',x=>Math.round(x*100)+'%'],['rSa','oSa','sa',x=>x.toFixed(2)],['rFe','oFe','fe',x=>x+'px'],['rBs','oBs','bst',x=>x.toFixed(2)+'x']]

  $('#winfo').innerHTML=`<h1>${t}</h1>
<div class="m-meta"><span class="ch">@${c}${chk}</span><span>高評価 ${likes} 件</span><span>${views}回</span><b style="color:#f1f1f1">その他</b></div>
<div class="m-act">${av(m.ch)}<button class="pill" style="max-width:38%;overflow:hidden;text-overflow:ellipsis;display:block;line-height:36px" data-t="sub">チャンネル...</button><button class="ib" data-t="like" aria-label="高評価">${ic('up')}</button><button class="ib dn" data-t="dislike" aria-label="低評価">${ic('up')}</button><button class="ib" aria-label="共有">${ic('share')}</button><button class="ib" aria-label="AI">${ic('spark')}</button><button class="ib" aria-label="その他">${ic('more')}</button></div>
<div class="card" data-t="comments" role="button" tabindex="0"><div class="row2" style="justify-content:space-between"><span><b style="font-size:15px">コメント</b> <span class="mut">${cm}</span></span><span class="cdots"><i></i><i></i><i></i></span></div><div class="row2" style="margin-top:12px;align-items:flex-start">${av(first[0],'s')}<span>${esc(first[1])}</span></div></div>`;
  $('#wside').innerHTML=REL.map((r,i)=>`<div class="rv">${thumb(i)}<div class="info">${av(r[1])}<div class="tx"><h4>${esc(r[0])}</h4><div class="mut">${esc(r[1])} ・ ${(h*(i+3)%900+10)}万 回視聴 ・ ${(i%11)+1}か月前</div></div><button class="ib dots3" style="width:28px" aria-label="メニュー">${ic('more')}</button></div></div>`).join('');
  $('#shT').innerHTML=`コメント <span class="mut" style="font-weight:400">${cm}</span>`;
  $('#shAv').innerHTML=av('あなた');
  $('#shL').innerHTML=Array.from({length:14},(_,i)=>{
    const n=NM[(i*3+h)%NM.length],x=TX[(i*5+h)%TX.length],lk=(h*(i+2))%900;
    return `<div class="cm">${av(n)}<div style="flex:1;min-width:0"><span class="u">@${esc(n)}</span> <span class="mut">${(i%11)+1}か月前</span><p>${esc(x)}</p><div class="ca"><button class="ib">${ic('up')}</button><span>${lk}</span><button class="ib dn">${ic('up')}</button><button class="ib" style="width:auto;padding:0 10px;font-size:12px">返信</button></div></div></div>`;
  }).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b)return;
  const k=b.dataset.t,r=$('#winfo');
  if(k==='comments')openComments();
  else if(k==='sub'){const on=b.classList.toggle('on');b.textContent=on?'登録済み':'チャンネル...'}
  else if(k==='like'){const on=b.classList.toggle('on');if(on){const d=r.querySelector('[data-t=dislike]');d&&d.classList.remove('on')}}
  else if(k==='dislike'){const on=b.classList.toggle('on');if(on){const l=r.querySelector('[data-t=like]');l&&l.classList.remove('on')}}
});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(bodyC.contains('csheet'))closeComments();else if(bodyC.contains('player')&&!document.fullscreenElement)exitPlayer()});

/* ---------- modes ---------- */
$('#bCinema').onclick=e=>e.currentTarget.classList.toggle('on',document.body.classList.toggle('cinema'));
$('#bFull').onclick=()=>{try{const st=$('#stage');if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(st.requestFullscreen||st.webkitRequestFullscreen).call(st)}catch(e){}};
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)){$('#bFull').hidden=true;$('#pFull').hidden=true}
if(!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia))$('#bCap').hidden=true;
if(!ENABLE_YT)$('#url').parentElement.hidden=true;
$('#aboutSample').hidden=!ENABLE_PLAYER_UI;
const setAbout=on=>document.body.classList.toggle('about-open',on);
$('#bAbout').onclick=()=>setAbout(true);$('#bAboutX').onclick=()=>setAbout(false);
$('#about').addEventListener('click',e=>{if(e.target.id==='about')setAbout(false)});
(()=>{const q=new URLSearchParams(location.search).get('v');if(ENABLE_YT&&q){$('#url').value=q;go()}})();

/* ---------- canvas copy loop ---------- */
function paint(){
  if(mode==='v'&&v.readyState>=2&&v.videoWidth)canvases.forEach(c=>{try{c.getContext('2d').drawImage(v,0,0,c.width,c.height)}catch(e){}});
}
if('requestVideoFrameCallback' in v){const loop=()=>{paint();v.requestVideoFrameCallback(loop)};v.requestVideoFrameCallback(loop)}
else{const tick=()=>{paint();requestAnimationFrame(tick)};requestAnimationFrame(tick)}
['seeked','pause','loadeddata'].forEach(n=>v.addEventListener(n,paint));
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW register failed',e));
}
</script>
</body>
</html>
